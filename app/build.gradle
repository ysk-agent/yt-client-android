plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'app.ytclient'
    compileSdk 35

    defaultConfig {
        applicationId 'app.ytclient'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.1.15'
        // Gemini key for the Detail screen's subtitle formatting. Injected
        // by CI from the GEMINI_API_KEY repo secret; empty for local builds
        // (the 整形 button then just toasts that no key is configured).
        buildConfigField 'String', 'GEMINI_API_KEY',
            '"' + (System.getenv('GEMINI_API_KEY') ?: '') + '"'
        buildConfigField 'String', 'GEMINI_MODEL', '"gemini-3.5-flash-lite"'
        ndk {
            // arm64 for real phones, x86_64 for the CI emulator.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        python {
            version '3.11'
            buildPython 'python3'
            pip {
                install 'httpx[http2]'
            }
        }
    }

    // Pinned signing key: CI decodes the keystore from the SIGNING_KEYSTORE_B64
    // repo secret and points SIGNING_KEYSTORE at it, so every build carries
    // the same certificate and can overwrite-install over previous builds.
    signingConfigs {
        pinned {
            def keystorePath = System.getenv('SIGNING_KEYSTORE')
            if (keystorePath != null) {
                storeFile = file(keystorePath)
                storePassword = System.getenv('SIGNING_STORE_PASS')
                keyAlias = System.getenv('SIGNING_KEY_ALIAS')
                keyPassword = System.getenv('SIGNING_KEY_PASS')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('SIGNING_KEYSTORE') != null) {
                signingConfig = signingConfigs.pinned
            }
        }
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
}
