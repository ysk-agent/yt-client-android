name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Emulator test scope (marker = read the [test: ...] marker from the HEAD commit message)"
        type: choice
        options: [marker, all, player, feed, none]
        default: marker
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The committing agent picks the emulator test scope per change
      # with a [test: all|player|feed|none] marker in the commit
      # message; no marker means all. A manual dispatch can override.
      # If a message mentions several markers (e.g. quoting the syntax
      # while describing the policy), the LAST one wins — the operative
      # marker belongs at the end of the message.
      - name: Determine test scope
        id: scope
        run: |
          SCOPE="${{ inputs.test_scope }}"
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "marker" ]; then
            MSG=$(git log -1 --format=%B)
            M=$(echo "$MSG" | grep -oE '\[test: (all|player|feed|none)\]' | tail -1 | sed 's/\[test: //; s/\]//')
            SCOPE="${M:-all}"
          fi
          echo "test scope: $SCOPE"
          case "$SCOPE" in
            all)    echo "sections=all"    >> "$GITHUB_OUTPUT"; echo "run_emulator=true"  >> "$GITHUB_OUTPUT" ;;
            player) echo "sections=player" >> "$GITHUB_OUTPUT"; echo "run_emulator=true"  >> "$GITHUB_OUTPUT" ;;
            feed)   echo "sections=feed"   >> "$GITHUB_OUTPUT"; echo "run_emulator=true"  >> "$GITHUB_OUTPUT" ;;
            none)   echo "sections="       >> "$GITHUB_OUTPUT"; echo "run_emulator=false" >> "$GITHUB_OUTPUT" ;;
            *)      echo "sections=all"    >> "$GITHUB_OUTPUT"; echo "run_emulator=true"  >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform 35 (only if missing)
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "platforms;android-35 and build-tools;35.0.0 already present on this runner; skipping sdkmanager install."
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK to fixed name
        run: cp app/build/outputs/apk/debug/app-debug.apk yt-client.apk
      # Upload before the emulator test so a test failure never blocks
      # the artifact (the pre-merge build workflow always produced it).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-client-apk
          path: yt-client.apk
          if-no-files-found: error
      - name: Enable KVM
        if: steps.scope.outputs.run_emulator == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # AVD + snapshot cache: a cold emulator boot was ~4.5 min of the
      # old emulator-launch workflow. On a cache miss the next step
      # boots once and saves a clean snapshot; later runs restore it
      # and boot from the snapshot instead of cold-booting.
      - name: AVD cache
        if: steps.scope.outputs.run_emulator == 'true'
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-pixel6-v1
      - name: Create AVD and generate snapshot for caching
        if: steps.scope.outputs.run_emulator == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."
      - name: Launch app on emulator
        if: steps.scope.outputs.run_emulator == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: TEST_SECTIONS=${{ steps.scope.outputs.sections }} bash ci/emulator-launch-test.sh
      - name: Upload launch diagnostics
        if: always() && steps.scope.outputs.run_emulator == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launch-diagnostics
          path: |
            logcat.txt
            player-probe.txt
            player-window-dump.xml
            probe-rate-setup.txt
            probe-pip.txt
            probe-return.txt
            probe-pause-setup.txt
            probe-paused-home.txt
            pip-dumpsys.txt
            screenshot-pip.png
            window_dump.xml
            screenshot-main.png
            screenshot-search.png
            screenshot-detail.png
            screenshot-player.png
            screenshot-channel.png
            screenshot-channellist.png
          if-no-files-found: warn
