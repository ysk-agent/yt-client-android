name: gemini-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List models supporting generateContent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is empty or missing"
            exit 1
          fi
          code=$(curl -s -o models.json -w "%{http_code}" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "--- error body ---"
            cat models.json
            exit 1
          fi
          echo "--- models supporting generateContent ---"
          python3 - <<'EOF'
          import json
          d = json.load(open("models.json"))
          names = []
          for m in d.get("models", []):
              if "generateContent" in m.get("supportedGenerationMethods", []):
                  names.append(m["name"].removeprefix("models/"))
          for n in sorted(names):
              print(n)
          print("--- flash-lite candidates ---")
          for n in sorted(names):
              if "flash-lite" in n:
                  print(n)
          EOF
